services:
  collector:
    build:
      context: .
      target: service
    environment:
      MODE: collector
    networks:
      lab:
        ipv4_address: 172.30.91.3
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    logging:
      options: {max-size: 10m, max-file: "1"}
  model-gateway:
    build:
      context: .
      target: service
    environment:
      MODE: ${STAND_MODE:-mock}
      MODEL: ${STAND_MODEL:-scripted-smoke}
      UPSTREAM: ${STAND_UPSTREAM:-}
      API_KEY: ${STAND_API_KEY:-}
      MAX_REQUESTS: "24"
      TRACE_SESSION: ${STAND_TRACE_SESSION:-0}
    networks:
      lab:
        ipv4_address: 172.30.91.2
      egress: {}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
  guard:
    build:
      context: .
      target: guard
    networks:
      lab:
        ipv4_address: 172.30.91.4
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    extra_hosts:
      - "collector.test:172.30.91.3"
      - "model-gateway.test:172.30.91.2"
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    healthcheck:
      test: [CMD, test, -f, /tmp/ready]
      interval: 1s
      timeout: 1s
      retries: 15
  agent:
    build:
      context: .
      target: agent
    network_mode: service:guard
    depends_on:
      guard:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /workspace:size=16m,uid=1000,gid=1000,mode=0700
      - /home/node:size=256m,uid=1000,gid=1000,mode=0700
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
networks:
  lab:
    internal: true
    ipam:
      config:
        - subnet: 172.30.91.0/24
  egress: {}
