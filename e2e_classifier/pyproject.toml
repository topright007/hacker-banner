[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidr-agent-monitor"
version = "0.1.0"
description = "An online agent monitor with conservative run-level confidentiality tracking"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "httpx>=0.27,<1", "uvicorn>=0.30,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
ml = ["scikit-learn>=1.5,<2"]
fasttext = ["fasttext==0.9.3", "scikit-learn>=1.5,<2"]

[project.scripts]
agent-monitor = "agent_monitor.cli:main"
monitor-fixtures = "agent_monitor.fixtures:main"
monitor-benchmarks = "agent_monitor.benchmarks:main"
action-risk = "agent_monitor.action_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
